name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag de versión (ej: v1.0.6)'
        required: false
        default: 'v1.0.6'
      release_notes:
        description: 'Notas de la versión / Changelog'
        required: false
        default: '⚡ Nueva actualización del Sistema Level Up: optimizaciones tácticas, 1,324 ejercicios y correcciones del núcleo CORTEX.'

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: ⬇️ Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 📦 Instalar Dependencias de Node
        run: npm install --legacy-peer-deps

      - name: 🔑 Configurar Variables de Entorno Base
        run: |
          touch .env
          echo "EXPO_PUBLIC_GEMINI_API_KEY=${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}" >> .env

      - name: 🏗️ Prebuild Nativo de Android con Expo
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔨 Compilar APK Release con Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon

      - name: 🏷️ Determinar Versión y Renombrar APK
        id: prepare_apk
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          
          # Renombrar APK para facilitar identificación
          APK_SOURCE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$APK_SOURCE" ]; then
            cp "$APK_SOURCE" "level-up-$TAG.apk"
            echo "APK_PATH=level-up-$TAG.apk" >> $GITHUB_ENV
            echo "✅ APK generado exitosamente: level-up-$TAG.apk"
          else
            echo "❌ No se encontró el archivo APK"
            exit 1
          fi

      - name: 📤 Subir APK como Artefacto del Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAG_NAME }}-apk
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: 🚀 Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Level Up ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          body: |
            ## ⚔️ Directiva del Sistema: Level Up ${{ env.TAG_NAME }}
            
            ${{ github.event.inputs.release_notes || '⚡ Nueva actualización del Sistema Level Up: optimizaciones tácticas, 1,324 ejercicios y mejoras del núcleo CORTEX.' }}
            
            ### 📲 Instalación en Android:
            1. Descarga el archivo `.apk` adjunto abajo.
            2. Ábrelo en tu teléfono Android y confirma la instalación.
            3. Todos tus progresos, nivel y estadísticas se conservarán intactos.
          files: ${{ env.APK_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
